name: Angular Conformance Tests

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular-major: [17, 18, 19, 20, 21, 'latest']

    name: Angular ${{ matrix.angular-major }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Angular ${{ matrix.angular-major }} compliance fixtures
        run: |
          if [ "${{ matrix.angular-major }}" = "latest" ]; then
            bash scripts/setup-conformance.sh
          else
            bash scripts/setup-conformance.sh ${{ matrix.angular-major }}
          fi

      - name: Run conformance tests
        env:
          ANGULAR_SOURCE_DIR: .angular-conformance
        run: npx vitest run angular-compiler/src/lib/conformance.spec.ts

      - name: Run compiler tests
        run: npx vitest run angular-compiler/ --exclude='**/conformance.spec.ts'
